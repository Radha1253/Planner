<!DOCTYPE html>
<html>
    <head>
        <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
        <title>Weather</title>
        <link rel = "stylesheet" href = "weather_style.css">
    </head>
    <body>
        <div class = "card">
            <div class = "search">
                <input type = "text" placeholder= "Enter City Name" spellcheck = "false">
                <button><img src = "search.png"></button>
            </div>
            <div class ="weather">
                <img src = "Light_Rain.png" class = "weather-icon">
                <h1 class = "temp">94°F</h1>
                <h2 class = "city">Houston</h2>
                <div class = "col">
                    <img src = "humidity.png">
                    <div>
                        <p class = "humidity">41%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class = "col">
                    <img src = "wind.png">
                    <div>
                        <p class = "wind">2 mph</p>
                        <p>Wind</p>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
